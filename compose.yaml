services:
  studio:
    image: where22/pokosomo-zero:latest
    build: .
    init: true
    # Same plain bridge network as `docker run` (and wslc): the container uses the host's DNS directly.
    network_mode: bridge
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8001}:8001"
    environment:
      HOST: 0.0.0.0
      PORT: 8001
      POKOSOMO_VENV: /opt/venv
      POKOSOMO_SECRETS: /app/data/secrets.json
      CODEX_HOME: /root/.codex-auth
      CLAUDE_CONFIG_DIR: /root/.claude-auth
    volumes:
      - ./workspace:/app/workspace
      - ./tmp:/app/tmp
      - ./data:/app/data
      - codex-auth:/root/.codex-auth
      - claude-auth:/root/.claude-auth
      - gemini-auth:/root/.gemini

volumes:
  codex-auth:
  claude-auth:
  gemini-auth:
