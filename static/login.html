<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Sign in · Pokosomo Studio</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #f4f2ed; --panel: #ffffff; --border: #e3dfd6; --text: #23211d; --muted: #6d685f;
      --accent: #d65b45; --accent-hover: #bd4938; --accent-soft: #fff0eb; --danger: #b4423a; --danger-soft: #fbeceb;
      --focus: #d65b4555;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181a; --panel: #212226; --border: #34363b; --text: #ecebe8; --muted: #a19d95;
        --accent: #ff9a82; --accent-hover: #ffb09d; --accent-soft: #3c2929; --danger: #e47a70; --danger-soft: #3a2422;
        --focus: #ff9a8266;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .card {
      width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--border);
      border-radius: 16px; padding: 32px 28px; box-shadow: 0 10px 40px #0000000d;
    }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
    .logo img { width: 36px; height: 36px; }
    .logo span { font-size: 18px; } .logo b { font-weight: 650; }
    h1 { font-size: 21px; margin: 0 0 4px; font-weight: 650; }
    p.sub { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
    label { display: block; font-weight: 550; font-size: 14px; margin: 14px 0 6px; }
    input[type=password], input[type=text] {
      width: 100%; padding: 11px 12px; font: inherit; color: var(--text); background: var(--panel);
      border: 1px solid var(--border); border-radius: 10px; outline: none;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
    #code { letter-spacing: 0.35em; font-size: 20px; text-align: center; font-variant-numeric: tabular-nums; }
    .hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
    .remember { display: flex; gap: 10px; align-items: flex-start; margin: 18px 0 4px; font-weight: 400; cursor: pointer; }
    .remember input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
    .remember small { display: block; color: var(--muted); font-size: 12.5px; }
    button {
      margin-top: 20px; width: 100%; padding: 12px; font: inherit; font-weight: 600; border: 0; border-radius: 10px;
      background: var(--accent); color: #fff; cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: .6; cursor: default; }
    button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .error {
      display: none; margin-top: 16px; padding: 10px 12px; border-radius: 10px;
      background: var(--danger-soft); color: var(--danger); font-size: 14px;
    }
    .error.show { display: block; }
    .notice { padding: 12px; border-radius: 10px; background: var(--accent-soft); font-size: 14px; }
    code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo"><img src="/favicon.svg" alt=""><span>Pokosomo <b>Studio</b></span></div>
    <div id="notConfigured" class="notice" hidden>
      Sign-in isn't set up yet. On the server, run <code>./setup_auth.sh</code> to choose a password.
    </div>
    <form id="form" autocomplete="on">
      <h1>Welcome back</h1>
      <p class="sub">Sign in to your research studio.</p>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <div id="codeBox" hidden>
        <label for="code">6-digit code</label>
        <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" placeholder="••••••">
        <div class="hint">Open your authenticator app and type the code shown for “Pokosomo Studio”.</div>
      </div>
      <label class="remember">
        <input type="checkbox" id="remember">
        <span>Remember me on this device<small>Stay signed in for 30 days. Leave unticked on shared computers — you'll be signed out when the browser closes.</small></span>
      </label>
      <button id="submit" type="submit">Sign in</button>
      <div class="error" id="error" role="alert"></div>
    </form>
  </main>
  <script>
    const form = document.getElementById('form');
    const err = document.getElementById('error');
    const btn = document.getElementById('submit');
    const code = document.getElementById('code');
    fetch('/api/auth/state').then(r => r.json()).then(s => {
      if (s.signed_in) location.replace('/');
      if (!s.configured) { document.getElementById('notConfigured').hidden = false; form.hidden = true; }
      if (s.totp) { document.getElementById('codeBox').hidden = false; code.required = true; }
    }).catch(() => {});
    code.addEventListener('input', () => { code.value = code.value.replace(/[^0-9]/g, '').slice(0, 6); });
    form.addEventListener('submit', async e => {
      e.preventDefault();
      err.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            password: document.getElementById('password').value,
            code: code.value,
            remember: document.getElementById('remember').checked,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) { location.replace('/' + location.hash); return; }
        err.textContent = data.detail || 'Sign-in failed.';
        err.classList.add('show');
        code.value = '';
        code.focus();
      } catch {
        err.textContent = 'Could not reach the server. Check your connection and try again.';
        err.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
